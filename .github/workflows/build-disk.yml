---
name: Build disk images

# Builds a qcow2 VM image and an Anaconda installer ISO from a published DINO
# image with bootc-image-builder, the same tool `just build-qcow2`/`build-iso`
# and the smoke test use:
#   qcow2         disk_config/disk.toml
#   anaconda-iso  disk_config/iso.toml (kickstart: locked root, no local user,
#                 installed system tracks the built tag)
# Pull requests that touch these files build both against `latest` but don't
# upload anything.

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
      image_tag:
        description: "Published image tag to build (the installed system tracks this tag)"
        required: true
        default: stable
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "disk_config/disk.toml"
      - "disk_config/iso.toml"
      - ".github/workflows/build-disk.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  # Pull requests test the disk configs against the newest image.
  IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
  PLATFORM: ${{ inputs.platform || 'amd64' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - disk-type: qcow2
            config: disk_config/disk.toml
          - disk-type: anaconda-iso
            config: disk_config/iso.toml
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare build
        id: prepare
        env:
          CONFIG: ${{ matrix.config }}
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}"
          {
            echo "image=${image}"
            echo "bib_image=$(sed -n 's/^BIB_IMAGE="\(.*\)"$/\1/p' image-template.env)"
            echo "artifact=${IMAGE_NAME,,}-${IMAGE_TAG}-${DISK_TYPE}-${PLATFORM}"
          } >> "$GITHUB_OUTPUT"

          # The installed system should keep tracking the tag it was built
          # from, so a feat-* ISO installs a system that follows feat-*.
          mkdir -p output
          sed -E "s#(${image}):[A-Za-z0-9._-]+#\1:${IMAGE_TAG}#g" "${CONFIG}" > config.toml
          grep -n 'bootc switch' config.toml || true

      - name: Pull image
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
        run: sudo podman pull "${IMAGE}:${IMAGE_TAG}"

      - name: Build disk image
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
          BIB_IMAGE: ${{ steps.prepare.outputs.bib_image }}
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          set -euo pipefail
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${PWD}/config.toml:/config.toml:ro" \
            -v "${PWD}/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            --type "${DISK_TYPE}" \
            --rootfs btrfs \
            --use-librepo=True \
            "${IMAGE}:${IMAGE_TAG}"
          sudo chown -R "$(id -u):$(id -g)" output
          (cd output && find . -type f \( -name '*.iso' -o -name '*.qcow2' \) -exec sha256sum {} + | tee SHA256SUMS)

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.artifact }}
          path: output
          if-no-files-found: error
          retention-days: 0
          compression-level: 0

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          SOURCE_DIR: output
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "$SOURCE_DIR" "S3:${S3_BUCKET_NAME}"
