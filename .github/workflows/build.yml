---
name: Build container image
on:
  pull_request:
    branches:
      - main
      - stable
  push:
    branches:
      - main
      - stable
      - feat/*
      - fix/*
    paths-ignore:
      - "**/README.md"
  # Weekly rebuild of main (schedules always run on the default branch), so
  # `latest` gets at least one new image per week even without commits. This
  # also picks up updates of Edge, Prisma, OneDrive and Himmelblau, which
  # Renovate doesn't track. The stable promotion (#93) relies on this cadence.
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image: ${{ steps.plan.outputs.image }}
      digest: ${{ steps.push-image.outputs.digest }}
      floating_tags: ${{ steps.gen-build-tags.outputs.floating_tags }}
      smoke_test: ${{ steps.plan.outputs.smoke_test }}

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      # The base image is not set here: every stream builds from the digest-pinned
      # BASE_IMAGE default in the Containerfile, which Renovate keeps current.
      # The published stream tag is derived from the branch name.
      - name: Check signing key matches cosign.pub
        run: |
          cmp cosign.pub system_files/usr/lib/pki/containers/dino.pub

      - name: Resolve stream tag
        id: resolve-stream
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          case "${BRANCH}" in
            stable) STREAM_TAG="stable" ;;
            main)   STREAM_TAG="latest" ;;
            feat/*) STREAM_TAG="feat-${BRANCH#feat/}" ;;
            fix/*)  STREAM_TAG="fix-${BRANCH#fix/}" ;;
            *)      STREAM_TAG="dev" ;;
          esac

          echo "STREAM_TAG=${STREAM_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${STREAM_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          sudo -E $(command -v just) ostree-rechunk \
            ${IMAGE_NAME} \
            ${STREAM_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    sudo -E $(command -v just) rechunk \
      #      ${IMAGE_NAME} \
      #      ${STREAM_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${STREAM_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

          # Floating tags (`<stream>`, `<stream>-YYYYMMDD`) move to every new
          # build; the SHA tags are unique to this build.
          floating=()
          immutable=()
          for tag in ${alias_tags}; do
            if [[ "${tag}" =~ ^${STREAM_TAG}(-[0-9]{8})?$ ]]; then
              floating+=("${tag}")
            else
              immutable+=("${tag}")
            fi
          done
          echo "floating_tags=${floating[*]}" >> "$GITHUB_OUTPUT"
          echo "immutable_tags=${immutable[*]}" >> "$GITHUB_OUTPUT"

      # latest and stable images (and manual runs, to test the gate on a
      # branch) only get their floating tags after the boot smoke test passed.
      # feat-*/fix-* pushes publish all tags right away.
      - name: Decide on smoke test
        id: plan
        run: |
          smoke_test=false
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]] &&
             [[ "${STREAM_TAG}" == "latest" || "${STREAM_TAG}" == "stable" ||
                "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            smoke_test=true
          fi
          echo "smoke_test=${smoke_test}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${STREAM_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing.
      # The push trigger above is already scoped to main/latest/stable/feat/*/fix/*, so any non-PR event here is a branch we intend to publish.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request'
        id: push-image
        env:
          # With a smoke test, the floating tags are added by the publish job.
          PUSH_TAGS: ${{ steps.plan.outputs.smoke_test == 'true' && steps.gen-build-tags.outputs.immutable_tags || steps.gen-build-tags.outputs.alias_tags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euox pipefail

          if [[ -z "${PUSH_TAGS}" ]]; then
            echo "::error::No tags to push (the smoke test needs a SHA tag)."
            exit 1
          fi
          set +x
          printf '%s' "${GITHUB_TOKEN}" | sudo podman login \
            --username "${GITHUB_ACTOR}" \
            --password-stdin \
            ghcr.io
          unset GITHUB_TOKEN
          set -x

          for tag in ${PUSH_TAGS}; do
            for attempt in 1 2 3; do
              if sudo podman push --digestfile=/tmp/digestfile \
                ${IMAGE_NAME}:${tag} \
                ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}; then
                break
              fi

              if [ "${attempt}" -eq 3 ]; then
                exit 1
              fi

              sleep $((attempt * 10))
            done
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request'
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: "v3.1.4"

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign \
            -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  smoke_test:
    name: Boot smoke test
    needs: build_push
    if: needs.build_push.outputs.smoke_test == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/smoke-test.yml
    with:
      image: ${{ needs.build_push.outputs.image }}
      digest: ${{ needs.build_push.outputs.digest }}

  publish:
    name: Attest and move stream tags
    needs: [build_push, smoke_test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ needs.build_push.outputs.image }}
      DIGEST: ${{ needs.build_push.outputs.digest }}
      FLOATING_TAGS: ${{ needs.build_push.outputs.floating_tags }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      # Signed record that this digest passed the smoke test. The stable
      # promotion (#93) only promotes digests that carry it.
      - name: Attest smoke test result
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg run "${RUN_URL}" \
            --arg commit "${GITHUB_SHA}" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{result: "passed", run: $run, commit: $commit, time: $time}' > smoke-test.json

          cosign attest \
            -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            --type https://github.com/boehringer-ingelheim/dino/smoke-test/v1 \
            --predicate smoke-test.json \
            "${IMAGE}@${DIGEST}"

      - name: Move floating tags to the tested digest
        run: |
          set -euo pipefail
          for tag in ${FLOATING_TAGS}; do
            skopeo copy --preserve-digests --retry-times 3 \
              "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${tag}"
            actual=$(skopeo inspect --raw "docker://${IMAGE}:${tag}" | sha256sum | cut -d' ' -f1)
            if [[ "sha256:${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to sha256:${actual}, expected ${DIGEST}"
              exit 1
            fi
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done
