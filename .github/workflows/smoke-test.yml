---
name: Boot smoke test

# Installs an image to a qcow2, boots it headless in QEMU/KVM and checks that
# the system came up (tests/smoke/). Called by build.yml before the floating
# stream tag is moved to a new image; can also be run by hand for any digest.

on:
  workflow_call:
    inputs:
      image:
        description: "Image without tag, e.g. ghcr.io/boehringer-ingelheim/dino"
        required: true
        type: string
      digest:
        description: "Digest to test, e.g. sha256:..."
        required: true
        type: string
      kernel_args:
        description: "Extra kernel arguments for the test VM (debugging)"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: "Image without tag, e.g. ghcr.io/boehringer-ingelheim/dino"
        required: true
        default: ghcr.io/boehringer-ingelheim/dino
        type: string
      digest:
        description: "Digest to test, e.g. sha256:..."
        required: true
        type: string
      kernel_args:
        description: "Extra kernel arguments for the test VM (debugging)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  boot:
    name: Boot and check image
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner's Ubuntu mirrors occasionally fail to resolve for a minute
      # or two; retry instead of failing an otherwise good build.
      - name: Install QEMU
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                qemu-system-x86 qemu-utils ovmf swtpm; then
              exit 0
            fi
            echo "::warning::apt failed (attempt ${attempt}), retrying in 60s"
            sleep 60
          done
          exit 1

      # Ubuntu confines every /usr/bin/bwrap with the unpriv_bwrap AppArmor
      # profile, also inside privileged containers. That blocks the mounts
      # osbuild (inside bootc-image-builder) does in its bwrap sandbox. The
      # swtpm profile only allows libvirt's state directories.
      - name: Unload AppArmor profiles that block the test
        run: |
          for profile in /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/usr.bin.swtpm; do
            if [[ -f "${profile}" ]]; then
              sudo apparmor_parser -R "${profile}" || true
            fi
          done

      - name: Pull image
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          sudo podman pull "${IMAGE}@${DIGEST}"

      - name: Boot and run checks
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          KERNEL_ARGS: ${{ inputs.kernel_args }}
        run: |
          sudo KERNEL_ARGS="${KERNEL_ARGS}" bash tests/smoke/run.sh "${IMAGE}@${DIGEST}"

      - name: Show AppArmor denials
        if: failure()
        run: |
          sudo dmesg | grep -i apparmor | tail -n 30 || true

      - name: Make logs readable
        if: always()
        run: |
          if [[ -d output/smoke ]]; then
            sudo chown -R "$(id -u):$(id -g)" output/smoke
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-logs${{ inputs.kernel_args != '' && '-custom' || '' }}
          path: |
            output/smoke/*.log
            output/smoke/screen.ppm
            output/smoke/config.toml
          if-no-files-found: ignore
          retention-days: 14
